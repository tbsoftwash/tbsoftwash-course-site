<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .h1{font:700 44px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#111827}
      .h2{font:600 26px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#111827}
      .p{font:400 20px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#374151}
      .chip{font:600 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#111827}
      .line{stroke:#111827;stroke-width:3}
      .grid{stroke:#e5e7eb;stroke-width:2}
      .box{fill:#ffffff;stroke:#111827;stroke-width:3;rx:18}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="80" y="110" class="h1">PSI vs GPM (Tradeoff)</text>
  <text x="80" y="155" class="p">More pressure isn’t automatically “better.” Flow (GPM) often drives speed. Pressure drives bite and risk.</text>

  <!-- chart area -->
  <rect x="80" y="210" width="980" height="560" class="box"/>

  <!-- grid -->
  <g>
    <line x1="140" y1="720" x2="1020" y2="720" class="line"/>
    <line x1="140" y1="270" x2="140" y2="720" class="line"/>

    <line x1="140" y1="630" x2="1020" y2="630" class="grid"/>
    <line x1="140" y1="540" x2="1020" y2="540" class="grid"/>
    <line x1="140" y1="450" x2="1020" y2="450" class="grid"/>
    <line x1="140" y1="360" x2="1020" y2="360" class="grid"/>

    <text x="120" y="725" class="p" text-anchor="end">Low</text>
    <text x="120" y="365" class="p" text-anchor="end">High</text>

    <text x="580" y="760" class="p" text-anchor="middle">Flow (GPM) →</text>
    <text x="95" y="495" class="p" text-anchor="middle" transform="rotate(-90 95 495)">Pressure (PSI) ↑</text>
  </g>

  <!-- zones -->
  <g>
    <rect x="170" y="600" width="300" height="90" fill="#eef2ff" stroke="#111827" stroke-width="2" rx="14"/>
    <text x="190" y="635" class="h2">Low PSI</text>
    <text x="190" y="665" class="p">Lower risk on delicate finishes</text>

    <rect x="520" y="600" width="460" height="90" fill="#ecfeff" stroke="#111827" stroke-width="2" rx="14"/>
    <text x="540" y="635" class="h2">Higher GPM</text>
    <text x="540" y="665" class="p">Moves dirt faster • uses more water</text>

    <rect x="170" y="300" width="810" height="140" fill="#fff7ed" stroke="#111827" stroke-width="2" rx="14"/>
    <text x="190" y="340" class="h2">High PSI zone</text>
    <text x="190" y="370" class="p">More bite • more fatigue • faster damage if you start too aggressive</text>
    <text x="190" y="400" class="p">Rule: start wide tip / low aggression → work up only if needed</text>
  </g>

  <!-- side notes -->
  <rect x="1100" y="210" width="420" height="560" class="box"/>
  <text x="1140" y="270" class="h2">TBSoftWash takeaways</text>
  <text x="1140" y="315" class="p">1) Match method to substrate</text>
  <text x="1140" y="350" class="p">2) Start mild → test spot</text>
  <text x="1140" y="385" class="p">3) GPM affects speed + runoff</text>
  <text x="1140" y="420" class="p">4) PSI affects risk + control</text>

  <text x="1140" y="490" class="h2">Homeowner-safe note</text>
  <text x="1140" y="535" class="p">If you’re unsure, don’t guess.</text>
  <text x="1140" y="570" class="p">Hire a pro for roofs, paint,</text>
  <text x="1140" y="605" class="p">screens, or delicate finishes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .h1{font:700 44px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#0f172a}
      .h2{font:700 24px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#0f172a}
      .p{font:400 20px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#334155}
      .muted{fill:#64748b}
      .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:2;rx:22}
      .glassy{fill:rgba(15,23,42,0.03);stroke:#e2e8f0;stroke-width:2;rx:22}
      .axis{stroke:#0f172a;stroke-width:3}
      .grid{stroke:#e2e8f0;stroke-width:2}
      .accent{fill:#2563eb}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>

  <text x="80" y="120" class="h1">PSI vs GPM (Tradeoff)</text>
  <text x="80" y="165" class="p">Hybrid style: clean white canvas + subtle glass panels + TBSoftWash blue accents.</text>

  <rect x="80" y="220" width="980" height="560" class="card"/>
  <rect x="1100" y="220" width="420" height="560" class="glassy"/>

  <g>
    <line x1="150" y1="720" x2="1020" y2="720" class="axis"/>
    <line x1="150" y1="270" x2="150" y2="720" class="axis"/>

    <line x1="150" y1="630" x2="1020" y2="630" class="grid"/>
    <line x1="150" y1="540" x2="1020" y2="540" class="grid"/>
    <line x1="150" y1="450" x2="1020" y2="450" class="grid"/>
    <line x1="150" y1="360" x2="1020" y2="360" class="grid"/>

    <text x="150" y="760" class="p">Low → High flow (GPM)</text>
    <text x="95" y="500" class="p" transform="rotate(-90 95 500)">Low → High pressure (PSI)</text>
  </g>

  <g>
    <rect x="185" y="600" width="300" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="205" y="636" class="h2">Lower PSI</text>
    <text x="205" y="666" class="p">Less risk on finishes</text>

    <rect x="520" y="600" width="475" height="90" rx="16" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
    <text x="540" y="636" class="h2">Higher GPM</text>
    <text x="540" y="666" class="p">Speed + water use + runoff</text>

    <rect x="185" y="320" width="810" height="150" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="205" y="360" class="h2">Start mild</text>
    <text x="205" y="392" class="p">Wide tip first → test spot → increase only if needed.</text>
    <text x="205" y="422" class="p muted">This protects paint, oxidation, and delicate substrates.</text>
  </g>

  <text x="1140" y="285" class="h2">TBSoftWash takeaways</text>
  <text x="1140" y="330" class="p">• Diagnosis before aggression</text>
  <text x="1140" y="362" class="p">• GPM affects speed + runoff</text>
  <text x="1140" y="394" class="p">• PSI affects bite + damage risk</text>

  <rect x="1140" y="455" width="330" height="40" rx="999" fill="#2563eb"/>
  <text x="1305" y="482" class="p" text-anchor="middle" fill="#ffffff" style="font-weight:700">Test spot</text>

  <text x="1140" y="545" class="p">Homeowner-safe: if unsure,</text>
  <text x="1140" y="577" class="p">hire a professional.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="rgba(59,130,246,0.35)"/>
      <stop offset="0.6" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <style>
      .h1{font:700 44px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#e5e7eb}
      .h2{font:600 26px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:#e5e7eb}
      .p{font:400 20px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;fill:rgba(229,231,235,0.78)}
      .muted{fill:rgba(229,231,235,0.60)}
      .stroke{stroke:rgba(229,231,235,0.18);stroke-width:2}
      .axis{stroke:rgba(229,231,235,0.55);stroke-width:3}
      .card{fill:rgba(255,255,255,0.06);stroke:rgba(255,255,255,0.12);stroke-width:2;rx:22}
      .chip{fill:rgba(59,130,246,0.16);stroke:rgba(59,130,246,0.45);stroke-width:2;rx:999}
    </style>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="520" fill="url(#glow)"/>

  <g>
    <rect x="78" y="66" width="220" height="34" class="chip"/>
    <text x="94" y="91" class="p" style="font-weight:600">TBSoftWash Academy</text>
  </g>

  <text x="80" y="160" class="h1">PSI vs GPM (Tradeoff)</text>
  <text x="80" y="205" class="p">Dark-glassy course diagram style. Clear, fast, and “operator proof.”</text>

  <!-- glass cards -->
  <rect x="80" y="240" width="980" height="540" class="card"/>
  <rect x="1100" y="240" width="420" height="540" class="card"/>

  <!-- chart axes + grid -->
  <g>
    <line x1="150" y1="725" x2="1020" y2="725" class="axis"/>
    <line x1="150" y1="300" x2="150" y2="725" class="axis"/>

    <line x1="150" y1="640" x2="1020" y2="640" class="stroke"/>
    <line x1="150" y1="555" x2="1020" y2="555" class="stroke"/>
    <line x1="150" y1="470" x2="1020" y2="470" class="stroke"/>
    <line x1="150" y1="385" x2="1020" y2="385" class="stroke"/>

    <text x="150" y="770" class="p" text-anchor="start">Low flow</text>
    <text x="1020" y="770" class="p" text-anchor="end">High flow (GPM)</text>

    <text x="105" y="720" class="p" text-anchor="end">Low</text>
    <text x="105" y="385" class="p" text-anchor="end">High PSI</text>
  </g>

  <!-- zones -->
  <g>
    <rect x="185" y="615" width="300" height="88" rx="16" fill="rgba(99,102,241,0.14)" stroke="rgba(99,102,241,0.35)" stroke-width="2"/>
    <text x="205" y="650" class="h2" style="font-size:22px">Lower PSI</text>
    <text x="205" y="680" class="p">Safer on delicate finishes</text>

    <rect x="520" y="615" width="475" height="88" rx="16" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.30)" stroke-width="2"/>
    <text x="540" y="650" class="h2" style="font-size:22px">Higher GPM</text>
    <text x="540" y="680" class="p">Faster rinse • more runoff to manage</text>

    <rect x="185" y="335" width="810" height="150" rx="18" fill="rgba(251,191,36,0.10)" stroke="rgba(251,191,36,0.22)" stroke-width="2"/>
    <text x="205" y="375" class="h2" style="font-size:22px">High PSI = fast damage if you start hot</text>
    <text x="205" y="405" class="p">Rule: start wide tip / low aggression → work up only if needed</text>
    <text x="205" y="435" class="p muted">(Fatigue + control matters. Premium work is consistent work.)</text>
  </g>

  <!-- side card content -->
  <text x="1140" y="305" class="h2">TBSoftWash takeaways</text>
  <text x="1140" y="350" class="p">• Diagnose soil + substrate first</text>
  <text x="1140" y="382" class="p">• GPM controls speed + water use</text>
  <text x="1140" y="414" class="p">• PSI controls bite + risk</text>
  <text x="1140" y="446" class="p">• Always test spot</text>

  <text x="1140" y="520" class="h2">Homeowner-safe</text>
  <text x="1140" y="565" class="p">If you’re unsure—don’t guess.</text>
  <text x="1140" y="597" class="p">Hire a pro for roofs, paint,</text>
  <text x="1140" y="629" class="p">screens, or delicate finishes.</text>
</svg>
